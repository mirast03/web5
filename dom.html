<html lang="en">
<head>

  <main>
    <h1>Part 2. DOM Manipulation</h1>

    <!-- Task 2 -->
    <section class="card">
      <h2>Task 2. Changing Content</h2>
      <p id="text">This is the first text. Click the button to change it.</p>
      <button id="changeTextBtn">Change text</button>
    </section>

    <!-- Task 3 -->
    <section class="card">
      <h2>Task 3. Changing Styles</h2>
      <div id="styleBox" class="style-box">
        <p>This is the text inside the block.</p>
      </div>
      <button id="changeColorBtn">Change background color</button>
      <button id="changeSizeBtn">Change font size</button>
    </section>

    <!-- Task 4 -->
    <section class="card">
      <h2>Task 4. Creating &amp; Removing Elements</h2>
      <ul id="itemList">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <button id="addItemBtn">Add Item</button>
      <button id="removeItemBtn">Remove Item</button>
    </section>
